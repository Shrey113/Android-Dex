name: Bug Report
description: Report a problem or unexpected behavior
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: Describe the issue and steps to reproduce.
      value: |
        - **OS Type:** [ Windows / Linux / macOS ]
        - **Android Version:** [ e.g. Android 14 ]
        - **Connecting Way:** [ USB / Wireless / Wireless USB Debugging ]

        ---

        Describe what went wrong:

        ### 1. Screenshots
        <!-- Drag and drop screenshot(s) here -->

        ### 2. Log File (android_dex_log)
        <!-- Attach or paste full android_dex_log content here -->
    validations:
      required: true
