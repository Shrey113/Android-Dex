name: Sync Issue Templates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-templates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Sync "Create New Issue" Popup Menu Templates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          if [[ -n $(git status --porcelain .github/ISSUE_TEMPLATE) ]]; then
            echo "Changes detected in .github/ISSUE_TEMPLATE. Committing and syncing..."
            git add .github/ISSUE_TEMPLATE
            git commit -m "chore: sync Create New Issue popup templates"
            git push origin main
            echo "Successfully updated and re-synced Issue Templates on GitHub!"
          else
            echo "No changes detected in .github/ISSUE_TEMPLATE. Templates are already up-to-date."
          fi
